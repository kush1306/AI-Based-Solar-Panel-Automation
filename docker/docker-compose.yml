services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: backend
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app
    env_file:
      - ../.env
    environment:
      - SOLAR_POSITION_API_URL=http://models:8000
      - ENERGY_OPTIMIZATION_API_URL=http://energy-optimization:8000
    depends_on:
      - db
      - models
      - energy-optimization
    restart: unless-stopped

  models:
    build:
      context: ../models/solar-position-api
      dockerfile: Dockerfile
    container_name: models-service
    ports:
      - "8001:8000"
    volumes:
      - ../models/solar-position-api:/app
      - ../data:/app/data
    env_file:
      - ../.env
    restart: unless-stopped

  energy-optimization:
    build:
      context: "../Solar AI"
      dockerfile: Dockerfile
    container_name: energy-optimization-service
    ports:
      - "8002:8000"
    volumes:
      - "../Solar AI:/app"
    restart: unless-stopped

  dashboard:
    build:
      context: ../dashboard
      dockerfile: Dockerfile
    container_name: dashboard
    ports:
      - "8501:8501"
    volumes:
      - ../dashboard:/app
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-solar_demand_db}
      MYSQL_USER: ${MYSQL_USER:-admin}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-admin}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  db_data:
